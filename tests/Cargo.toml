[package]
name = "cyberchef-rust-tests"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rxchef = { version = "0.1.0", path = "../" }
regex = "1.12.3"
hex = "0.4.3"
image = "0.25"
imageproc = "0.25"
tar = "0.4.45"
fuzzyhash = "0.2.2"
bson = "2"
base64 = "0.22"
flate2 = "1"
zip = { version = "8.6.0", features = ["deflate"] }
bcrypt = "0.19.1"
xz2 = "0.1"
lz4_flex = "0.9"
plotters = "0.3"
encoding_rs = "0.8"
fernet = "0.2"
libsm = "0.6.1"
p256 = { version = "0.13.2", features = ["pem", "pkcs8"] }
ring = "0.17.14"
hmac = "0.12"
sha2 = "0.10"

[features]
default = []
jsonata = ["rxchef/jsonata"]
tesseract = ["rxchef/tesseract"]
pgp = ["rxchef/pgp"]
yara = ["rxchef/yara"]
disassembly = ["rxchef/disassembly"]
full = ["pgp", "jsonata", "tesseract", "yara", "disassembly"]
