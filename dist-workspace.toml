[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Our own tap, not homebrew/core. Requires HOMEBREW_TAP_TOKEN (see
# docs/development/releasing.md) with write access to this one repo only.
tap = "MichaelWeissDEV/homebrew-tap"
# publish-prereleases defaults to false, which is exactly what we want:
# prerelease tags (v0.2.0-rc.1 etc.) build archives/installers but never
# touch the stable Homebrew tap or crates.io.
#
# AUR is intentionally NOT in this list. The PKGBUILD/.SRCINFO in
# packaging/aur/ are built and functionally tested in CI (build-aur, below)
# and attached to the GitHub Release as artifacts, but nothing is pushed to
# the real aur.archlinux.org remote — this is a deliberate scope decision,
# not a placeholder. See docs/development/releasing.md if that changes.
publish-jobs = ["homebrew", "./publish-crates"]
# Validate the tag itself (version/changelog/lockfile/docs/audit — see
# scripts/check-release-tag.sh) before dist does anything else, and rerun
# the full release gate on the exact tag commit rather than trusting that
# master was green when the tag was created.
plan-jobs = ["./validate-tag"]
local-artifacts-jobs = ["./release-gates"]
# Uploaded under the "artifacts-*" name convention dist's own local/global
# artifact jobs use, so the `host` job's `pattern: artifacts-*` download
# picks these up and attaches them to the GitHub release automatically —
# no custom hosting logic needed.
global-artifacts-jobs = ["./build-deb", "./build-rpm", "./build-aur"]

# Pin third-party GitHub Actions used by the generated workflow to specific
# commits rather than trusting a mutable tag at release time.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c" # v8
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7
