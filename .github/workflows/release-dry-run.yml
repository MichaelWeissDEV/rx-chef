name: Release dry run

# Manually-triggered rehearsal of the full release pipeline, safe to run at
# any time against any branch: it exercises everything release.yml would
# do, EXCEPT the four irreversible/external side effects — no GitHub
# Release is created, nothing is uploaded to crates.io, nothing is pushed
# to the AUR, nothing is pushed to the Homebrew tap.
#
# This is intentionally NOT part of dist-workspace.toml's generated
# surface: dist's "publishing" logic can't distinguish a manual dry run
# from a real tag push (both are "not a pull_request"), so folding this
# into release.yml risks it actually publishing. Keeping it a separate,
# hand-maintained file avoids that entirely.
#
# Run before cutting a real tag to catch problems for free.

on:
  workflow_dispatch:
    inputs:
      retain-artifacts:
        description: Explicitly upload rehearsal artifacts to GitHub Actions storage
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ui-acceptance:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check UI acceptance rules without requiring human acceptance for rehearsal
        run: |
          python3 scripts/test-release-download.py
          python3 scripts/test-ui-acceptance.py
          python3 scripts/check-ui-acceptance.py --allow-pending

  validate-tag:
    uses: ./.github/workflows/validate-tag.yml

  release-gates:
    needs: validate-tag
    uses: ./.github/workflows/release-gates.yml
    with:
      plan: "dry-run"

  build-workbench:
    needs: validate-tag
    uses: ./.github/workflows/build-workbench.yml
    with:
      plan: "dry-run"
      upload-artifacts: ${{ inputs.retain-artifacts }}

  dist-plan-and-build:
    needs: validate-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1

      - name: Install dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh

      - name: dist plan
        run: dist plan

      - name: dist build (host mode — as much as this runner can build)
        run: dist build

      - name: Homebrew formula sanity check
        run: |
          dist build --artifacts=global
          ruby --version
          for formula in target/distrib/*.rb; do
            echo "=== $formula ==="
            ruby -c "$formula"
          done

  build-deb:
    needs: validate-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0
      - name: Build
        run: ./scripts/build-deb.sh
      - name: Install, exercise, remove and reinstall actual DEB packages
        run: |
          for attempt in 1 2; do
            sudo apt-get install -y ./target/debian/rxchef_*.deb ./target/debian/rxchef-tui_*.deb
            test "$(printf 'hello' | /usr/bin/rxchef run to_base64)" = "aGVsbG8="
            python3 scripts/tui-graph-smoke.py /usr/bin/rxchef_tui
            sudo apt-get remove -y rxchef rxchef-tui
          done
      - name: Upload for inspection
        if: inputs.retain-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: dry-run-deb-packages
          path: target/debian/*.deb

  build-rpm:
    needs: validate-tag
    runs-on: ubuntu-22.04
    container:
      image: fedora:latest
    steps:
      - name: Install build tooling
        run: dnf install -y gcc pkgconf-pkg-config openssl-devel curl python3
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96.1
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked --version 0.21.0
      - name: Build
        run: ./scripts/build-rpm.sh
      - name: Install, exercise, remove and reinstall actual RPM packages
        run: |
          for attempt in 1 2; do
            dnf install -y target/generate-rpm/rxchef-[0-9]*.rpm target/generate-rpm/rxchef-tui-*.rpm
            test "$(printf 'hello' | /usr/bin/rxchef run to_base64)" = "aGVsbG8="
            python3 scripts/tui-graph-smoke.py /usr/bin/rxchef_tui
            dnf remove -y rxchef rxchef-tui
          done
      - name: Upload for inspection
        if: inputs.retain-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: dry-run-rpm-packages
          path: target/generate-rpm/*.rpm

  build-aur:
    needs: validate-tag
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    container:
      image: archlinux:latest
    steps:
      - name: Install build tooling
        run: pacman -Syu --noconfirm --needed base-devel git rust cargo openssl pkgconf namcap python
      - name: Create an unprivileged build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Render PKGBUILD against the current workspace version (not a real tag)
        run: |
          version=$(cargo metadata --locked --format-version 1 --no-deps \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(p['version'] for p in d['packages'] if p['name']=='rxchef'))")
          pkgver="${version/-/}"
          sha256=$(curl --fail --show-error --location "https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz" | sha256sum | cut -d' ' -f1)
          sed -i \
            -e "s/^pkgver=.*/pkgver=${pkgver}/" \
            -e "s/^_releasever=.*/_releasever=${{ github.sha }}/" \
            -e "s|^source=.*|source=(\"rxchef-\${pkgver}.tar.gz::https://github.com/${{ github.repository }}/archive/${{ github.sha }}.tar.gz\")|" \
            -e "s/^sha256sums=.*/sha256sums=('${sha256}')/" \
            packaging/aur/PKGBUILD
      - name: Generate .SRCINFO, build, and lint
        run: |
          chown -R builder:builder packaging/aur
          su builder -c '
            set -euo pipefail
            cd packaging/aur
            makepkg --printsrcinfo > .SRCINFO
            makepkg --verifysource
            makepkg --syncdeps --noconfirm --clean
            namcap PKGBUILD
          '
      - name: Install, exercise, remove and reinstall actual Arch packages
        run: |
          for attempt in 1 2; do
            pacman -U --noconfirm packaging/aur/rxchef-[0-9]*.pkg.tar.* packaging/aur/rxchef-tui-*.pkg.tar.*
            test "$(printf 'hello' | /usr/bin/rxchef run to_base64)" = "aGVsbG8="
            python3 scripts/tui-graph-smoke.py /usr/bin/rxchef_tui
            pacman -R --noconfirm rxchef rxchef-tui
          done
      - name: Upload for inspection
        if: inputs.retain-artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: dry-run-aur-packages
          path: |
            packaging/aur/*.pkg.tar.*
            packaging/aur/.SRCINFO

  publish-crates-dry-run:
    needs: validate-tag
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup default 1.96.1
      - name: cargo publish --dry-run (core; dependent crates cannot
          dry-run until their dependencies are actually live — see
          docs/development/releasing.md)
        run: |
          ./scripts/publish-crate.sh rxchef --dry-run
          echo "::notice::rxchef-store, rxchef-client, rxchef-cli and rxchef-tui dry-runs are skipped here: cargo publish resolves path deps against the real registry even in --dry-run, so they can only be validated once their dependencies, including rxchef-client for the TUI, are actually published. cargo package --list validates each package content list below."
          cargo package --locked -p rxchef-store --allow-dirty --list
          cargo package --locked -p rxchef-client --allow-dirty --list
          cargo package --locked -p rxchef-cli --allow-dirty --list
          cargo package --locked -p rxchef-tui --allow-dirty --list

  summary:
    needs:
      - ui-acceptance
      - build-workbench
      - validate-tag
      - release-gates
      - dist-plan-and-build
      - build-deb
      - build-rpm
      - build-aur
      - publish-crates-dry-run
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Report
        run: |
          echo "This was a dry run: no GitHub Release, no crates.io upload, no AUR push, no Homebrew push."
          echo "ui-acceptance:            ${{ needs.ui-acceptance.result }}"
          echo "build-workbench:          ${{ needs.build-workbench.result }}"
          echo "release-gates:            ${{ needs.release-gates.result }}"
          echo "dist-plan-and-build:      ${{ needs.dist-plan-and-build.result }}"
          echo "build-deb:                ${{ needs.build-deb.result }}"
          echo "build-rpm:                ${{ needs.build-rpm.result }}"
          echo "build-aur:                ${{ needs.build-aur.result }}"
          echo "publish-crates-dry-run:   ${{ needs.publish-crates-dry-run.result }}"
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "DRY RUN: FAIL"
            exit 1
          fi
          echo "DRY RUN: PASS"
