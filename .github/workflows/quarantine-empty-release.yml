name: Quarantine empty failed release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/quarantine-empty-release.yml']
permissions:
  contents: write
jobs:
  quarantine:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Withdraw only the known empty failed 0.0.1 announcement
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/"$GH_REPO"/releases/414292578 > /tmp/release.json
          jq -e '.tag_name == "v0.0.1" and .target_commitish == "3cd535accc7b1cb5f934b79464f20249d85ff99a" and (.assets | length == 1) and .assets[0].name == "dist-manifest.json" and .assets[0].download_count == 0' /tmp/release.json
          gh api --method PATCH repos/"$GH_REPO"/releases/414292578 -F draft=true --silent
          gh api --method DELETE repos/"$GH_REPO"/releases/414292578 --silent
          echo 'Empty failed announcement removed; source tag preserved.'
