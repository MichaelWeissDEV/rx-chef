name: Cancel superseded unpublished release attempts
on:
  push:
    branches: [master]
    paths: ['.github/workflows/cancel-superseded-release-runs.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Cancel only the identified superseded tag attempts
        shell: bash
        run: |
          set -euo pipefail
          for run in 38810707652 38811113469 38812265039; do
            case "$run" in
              38810707652) expected=f8ddc0ec292bdf36a5ef2ff83aa7355153d1eb38 ;;
              38811113469) expected=aad17bde8358db8ddd083c27957e7f293b35c04e ;;
              38812265039) expected=28b5692dfaf0653f03f7950ceaec1d0c3be3c2f9 ;;
            esac
            gh api repos/"$GH_REPO"/actions/runs/"$run" > /tmp/run.json
            jq -e --arg expected "$expected" '.head_branch == "v0.0.1" and .head_sha == $expected and .path == ".github/workflows/release.yml"' /tmp/run.json
            if ! jq -e '.status == "completed"' /tmp/run.json >/dev/null; then
              gh api --method POST repos/"$GH_REPO"/actions/runs/"$run"/cancel --silent
            fi
          done
