name: Server container build and smoke

on:
  workflow_call: {}
  workflow_dispatch: {}
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'crates/**', 'apps/web/**', 'docker/Dockerfile.server', '.dockerignore', 'compose.yaml', 'scripts/test-container.py', '.github/workflows/container.yml']
  push:
    branches: [master]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', 'crates/**', 'apps/web/**', 'docker/Dockerfile.server', '.dockerignore', 'compose.yaml', 'scripts/test-container.py', '.github/workflows/container.yml']

permissions:
  contents: read

jobs:
  container:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        variant: [web, headless]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build runtime image without publishing
        run: docker build -f docker/Dockerfile.server --target ${{ matrix.variant }} -t rxchef-server:ci .
      - name: Test actual runtime image
        run: python3 scripts/test-container.py --image rxchef-server:ci --variant ${{ matrix.variant }}
      - name: Test host-network deployment on native Linux
        run: python3 scripts/test-container.py --image rxchef-server:ci --variant ${{ matrix.variant }} --host-network
      - name: Validate local Compose configuration
        run: RXCHEF_TOKEN=ci-compose-validation-0123456789 docker compose config --quiet
