name: Build AUR package

# Called by release.yml (dist's global-artifacts-jobs extension point).
# Renders packaging/aur/PKGBUILD for this exact release, builds it inside a
# real Arch Linux container, installs and functionally exercises the result,
# then uploads PKGBUILD/.SRCINFO/the built packages as GitHub Release
# artifacts.
#
# This deliberately does NOT push to the real aur.archlinux.org remote —
# that's a separate decision (see docs/development/releasing.md) requiring
# an AUR account and registered SSH key that don't exist yet. The rendered
# PKGBUILD/.SRCINFO here are a "local" release: versioned in this repo and
# attached to the GitHub Release, nothing published to an external package
# index.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - name: Install build tooling
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust cargo openssl pkgconf namcap

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      # makepkg refuses to run as root, which is what every container step
      # runs as by default. Create the user after checkout so it owns the
      # files actions/checkout just wrote.
      - name: Create an unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # All makedepends were already installed as root above, so
          # --syncdeps below should be a no-op check, but give it passwordless
          # sudo anyway rather than have a fresh Arch mirror snapshot fail on
          # an assumption about what's already satisfied.
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Determine version and compute source tarball checksum
        id: meta
        run: |
          version="${{ fromJson(inputs.plan).announcement_tag }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          url="https://github.com/${{ github.repository }}/archive/refs/tags/v${version}.tar.gz"
          sha256=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          if [[ -z "$sha256" ]]; then
            echo "error: could not compute sha256 for $url" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Render PKGBUILD for this release
        run: |
          sed -i \
            -e "s/^pkgver=.*/pkgver=${{ steps.meta.outputs.version }}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${{ steps.meta.outputs.sha256 }}')/" \
            packaging/aur/PKGBUILD

      - name: Generate .SRCINFO, build, and lint (as the unprivileged user)
        run: |
          chown -R builder:builder packaging/aur
          su builder -c '
            set -euo pipefail
            cd packaging/aur
            makepkg --printsrcinfo > .SRCINFO
            makepkg --verifysource
            makepkg --syncdeps --noconfirm --clean
            namcap PKGBUILD || true
            for pkg in *.pkg.tar.*; do
              namcap "$pkg" || true
            done
          '

      - name: Functional smoke test of the built package
        run: |
          pacman -U --noconfirm packaging/aur/rxchef-*.pkg.tar.* packaging/aur/rxchef-tui-*.pkg.tar.*
          rxchef --version
          printf 'hello' | rxchef run to_base64
          rxchef_tui --help >/dev/null
          pacman -R --noconfirm rxchef rxchef-tui

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: artifacts-aur
          path: |
            packaging/aur/PKGBUILD
            packaging/aur/.SRCINFO
            packaging/aur/*.pkg.tar.*
