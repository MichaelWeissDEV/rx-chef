name: Publish to AUR

# Called by release.yml (dist's publish-jobs extension point) after the
# GitHub Release is live. Renders packaging/aur/PKGBUILD for this exact
# release, builds and lints it inside a real Arch Linux container, and only
# if that succeeds pushes PKGBUILD + .SRCINFO to the AUR git remote.
#
# The AUR has no binary packages: this pushes source (PKGBUILD + .SRCINFO),
# and users' pacman/AUR helpers build from the tagged GitHub source tarball
# — never from a branch snapshot, so a later force-push to master cannot
# silently change what an already-published AUR version builds.

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    environment: release
    container:
      image: archlinux:latest
    steps:
      - name: Install build tooling
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh rust cargo openssl pkgconf namcap jq

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      # makepkg refuses to run as root, which is what every container step
      # runs as by default. Create the user after checkout so it owns the
      # files actions/checkout just wrote.
      - name: Create an unprivileged build user
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          # All makedepends were already installed as root above, so
          # --syncdeps below should be a no-op check, but give it passwordless
          # sudo anyway rather than have a fresh Arch mirror snapshot fail on
          # an assumption about what's already satisfied.
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - name: Determine version and compute source tarball checksum
        id: meta
        run: |
          version="${{ fromJson(inputs.plan).announcement_tag }}"
          version="${version#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          url="https://github.com/${{ github.repository }}/archive/refs/tags/v${version}.tar.gz"
          sha256=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)
          if [[ -z "$sha256" ]]; then
            echo "error: could not compute sha256 for $url" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Render PKGBUILD for this release
        run: |
          sed -i \
            -e "s/^pkgver=.*/pkgver=${{ steps.meta.outputs.version }}/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('${{ steps.meta.outputs.sha256 }}')/" \
            packaging/aur/PKGBUILD

      - name: Generate .SRCINFO, build, and lint (as the unprivileged user)
        run: |
          chown -R builder:builder packaging/aur
          su builder -c '
            set -euo pipefail
            cd packaging/aur
            makepkg --printsrcinfo > .SRCINFO
            makepkg --verifysource
            makepkg --syncdeps --noconfirm --clean
            namcap PKGBUILD || true
            for pkg in *.pkg.tar.*; do
              namcap "$pkg" || true
            done
          '

      - name: Functional smoke test of the built package
        run: |
          pacman -U --noconfirm packaging/aur/rxchef-*.pkg.tar.* packaging/aur/rxchef-tui-*.pkg.tar.*
          rxchef --version
          printf 'hello' | rxchef run to_base64
          rxchef_tui --help >/dev/null
          pacman -R --noconfirm rxchef rxchef-tui

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          if [[ -z "$AUR_SSH_PRIVATE_KEY" || -z "$AUR_KNOWN_HOSTS" ]]; then
            echo "::error::AUR_SSH_PRIVATE_KEY / AUR_KNOWN_HOSTS not configured in the 'release' environment; see docs/development/releasing.md" >&2
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts

          git config --global user.name "rxchef release bot"
          git config --global user.email "michael.weiss.std@gmail.com"

          git clone ssh://aur@aur.archlinux.org/rxchef.git aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO aur-repo/
          cd aur-repo
          if git diff --quiet; then
            echo "AUR package already up to date for this version; nothing to push."
            exit 0
          fi
          git add PKGBUILD .SRCINFO
          git commit -m "rxchef ${{ steps.meta.outputs.version }}"
          git push origin master
