name: Platform checks

on:
  pull_request:
  push:
    # This repository develops on `master`. The trigger previously listed only
    # `main`, so no push to the default branch ever started these checks.
    # `main` is kept so the workflow keeps working if the branch is renamed.
    branches:
      - master
      - main
  workflow_dispatch:
  # Also callable from release.yml (via .github/workflows/release-gates.yml)
  # so the release pipeline re-runs this exact gate definition on the tag
  # commit, instead of trusting that master was green when the tag was cut
  # or maintaining a second, drifting copy of the same checks.
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-container:
    name: Linux release container
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run the complete Linux release gate
        run: ./scripts/release-check-linux.sh

  windows-cross-container:
    name: Windows GNU cross-build container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build Windows CLI and TUI
        run: ./scripts/check-windows-cross.sh

  native-portability:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prefer Strawberry Perl over Git's bundled Perl
        # Git for Windows ships its own minimal `perl` earlier on PATH than
        # Strawberry Perl in bash shells on the windows-latest runner. That
        # perl lacks Locale::Maketext::Simple (used by IPC::Cmd), which
        # breaks openssl-sys's vendored OpenSSL build (see Cargo.toml's
        # windows `openssl` dependency). Put Strawberry Perl first instead.
        if: matrix.os == 'windows-latest'
        run: echo "C:/Strawberry/perl/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Run the native portability gate
        run: ./scripts/check-native-platform.sh
