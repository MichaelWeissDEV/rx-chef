name: Platform checks

on:
  pull_request:
  push:
    # This repository develops on `master`. The trigger previously listed only
    # `main`, so no push to the default branch ever started these checks.
    # `main` is kept so the workflow keeps working if the branch is renamed.
    branches:
      - master
      - main
  workflow_dispatch:
  # Also callable from release.yml (via .github/workflows/release-gates.yml)
  # so the release pipeline re-runs this exact gate definition on the tag
  # commit, instead of trusting that master was green when the tag was cut
  # or maintaining a second, drifting copy of the same checks.
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: platform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-container:
    name: Linux release container
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run the complete Linux release gate
        run: ./scripts/release-check-linux.sh

  windows-cross-container:
    name: Windows GNU cross-build container
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cross-build Windows CLI and TUI
        run: ./scripts/check-windows-cross.sh

  native-portability:
    name: Native ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prefer Strawberry Perl over Git's bundled Perl
        # Git for Windows ships its own minimal `perl` earlier on PATH than
        # Strawberry Perl in bash shells on the windows-latest runner. That
        # perl lacks Locale::Maketext::Simple (used by IPC::Cmd), which
        # breaks openssl-sys's vendored OpenSSL build (see Cargo.toml's
        # windows `openssl` dependency). Select it explicitly: Bash may prepend
        # its own bin directory again even after GITHUB_PATH is updated.
        if: matrix.os == 'windows-latest'
        run: |
          echo 'C:/Strawberry/perl/bin' >> "$GITHUB_PATH"
          echo 'OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe' >> "$GITHUB_ENV"
          'C:/Strawberry/perl/bin/perl.exe' -MLocale::Maketext::Simple -MIPC::Cmd -e 'print "OpenSSL Perl ready\n"'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --component rustfmt,clippy
          rustup default 1.96.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt
      - name: Install Linux desktop and optional OCR dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libtesseract-dev libleptonica-dev tesseract-ocr-eng clang cmake libclang-dev
      - name: Install macOS optional OCR dependencies
        if: runner.os == 'macOS'
        run: |
          brew install tesseract pkgconf
          pkg-config --modversion tesseract
      - name: Install Windows static OCR dependencies and pkg-config
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot -or -not (Test-Path "$vcpkgRoot/vcpkg.exe")) {
            throw 'The native runner must provide VCPKG_INSTALLATION_ROOT and vcpkg.exe'
          }
          # Record the runner's exact ports baseline; do not update it implicitly.
          git -C "$vcpkgRoot" rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify vcpkg baseline' }
          $installRoot = "$env:RUNNER_TEMP/rxchef-vcpkg-installed"
          & "$vcpkgRoot/vcpkg.exe" install tesseract:x64-windows-static pkgconf:x64-windows-static "--x-install-root=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Static Tesseract/pkgconf installation failed' }
          & "$vcpkgRoot/vcpkg.exe" list "--x-install-root=$installRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inventory installed native packages' }
          $prefix = "$installRoot/x64-windows-static"
          $pkgconf = "$prefix/tools/pkgconf/pkgconf.exe"
          if (-not (Test-Path $pkgconf)) { throw "Missing native pkgconf executable: $pkgconf" }
          # tesseract-rs 0.4.0 retains `#[link(name = "tesseract")]` in its
          # FFI declarations even when `use-system-tesseract` is selected.
          # vcpkg 5.5 installs the static archive as tesseract55.lib, while
          # pkgconf correctly reports `-ltesseract55`. Provide the exact alias
          # required by those declarations and prove it names the same archive.
          $tesseractArchive = "$prefix/lib/tesseract55.lib"
          $tesseractAlias = "$prefix/lib/tesseract.lib"
          if (-not (Test-Path $tesseractArchive)) {
            throw "Missing vcpkg Tesseract static archive: $tesseractArchive"
          }
          Copy-Item -Force -LiteralPath $tesseractArchive -Destination $tesseractAlias
          if ((Get-FileHash -Algorithm SHA256 $tesseractArchive).Hash -ne (Get-FileHash -Algorithm SHA256 $tesseractAlias).Hash) {
            throw 'The tesseract-rs compatibility archive does not match vcpkg Tesseract'
          }
          $env:PKG_CONFIG = $pkgconf
          $env:PKG_CONFIG_PATH = "$prefix/lib/pkgconfig;$prefix/share/pkgconfig"
          $env:PKG_CONFIG_LIBDIR = $env:PKG_CONFIG_PATH
          $env:PKG_CONFIG_ALL_STATIC = '1'
          & $pkgconf --modversion tesseract
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve tesseract.pc' }
          & $pkgconf --static --libs tesseract
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the complete static OCR link closure' }
          foreach ($name in @('PKG_CONFIG', 'PKG_CONFIG_PATH', 'PKG_CONFIG_LIBDIR', 'PKG_CONFIG_ALL_STATIC')) {
            "$name=$([Environment]::GetEnvironmentVariable($name))" >> $env:GITHUB_ENV
          }
          # vcpkg installs the library, not the English language model. Use the
          # immutable tessdata_fast 4.1.0 commit and log the actual model hash.
          $tessdata = "$env:RUNNER_TEMP/rxchef-tessdata"
          New-Item -ItemType Directory -Force -Path $tessdata | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/65727574dfcd264acbb0c3e07860e4e9e9b22185/eng.traineddata' -OutFile "$tessdata/eng.traineddata"
          Get-FileHash -Algorithm SHA256 "$tessdata/eng.traineddata"
          "TESSDATA_PREFIX=$tessdata" >> $env:GITHUB_ENV
          & "$prefix/tools/tesseract/tesseract.exe" --list-langs --tessdata-dir "$tessdata"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot load the installed OCR language data' }
      - name: Run the native portability gate
        run: ./scripts/check-native-platform.sh
      - name: Build native desktop installer
        run: npm --prefix apps/web run desktop:build
