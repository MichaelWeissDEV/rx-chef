name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Rust: build, test, and the generated-artifact freshness gates ───────────
  rust:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # yara-x, capstone, xz2 and bzip2 build native code; bindgen needs libclang.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            liblzma-dev libbz2-dev zlib1g-dev \
            libtesseract-dev libleptonica-dev tesseract-ocr-eng

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build workspace (Unix)
        if: runner.os != 'Windows'
        run: cargo build --workspace --all-targets

      - name: Test workspace (Unix)
        if: runner.os != 'Windows'
        run: cargo test --workspace

      - name: Build Core, CLI, and Store (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p rxchef -p rxchef_cli -p rxchef_store --all-targets

      - name: Test Core, CLI, and Store (Windows)
        if: runner.os == 'Windows'
        run: cargo test -p rxchef -p rxchef_cli -p rxchef_store

      - name: Check all optional features (Linux)
        if: runner.os == 'Linux'
        run: cargo check --workspace --all-targets --all-features

      - name: Test all optional features (Linux)
        if: runner.os == 'Linux'
        run: cargo test --workspace --all-features

      - name: Fuzz targets compile (Linux)
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

      # Both generated-documentation artifacts have their own --check mode.
      # Without these gates they drift silently whenever an operation's
      # description() or argument schema changes.
      - name: Operation docs are current (docs/operations/)
        if: runner.os == 'Linux'
        run: cargo run -p xtask -- docs --check

      - name: Operation reference is current (docs/reference/operations.md)
        if: runner.os == 'Linux'
        run: cargo run --example generate_operation_docs -- --check

      - name: Generated registry is committed and current
        if: runner.os == 'Linux'
        run: cargo xtask check-registry

      - name: Operation quality audit is current
        if: runner.os == 'Linux'
        run: cargo xtask audit-operations

      - name: Normal builds and generators leave no diff
        if: runner.os == 'Linux'
        run: git diff --exit-code

  # ── Lint: formatting and clippy, kept separate so a lint failure is legible ─
  lint:
    name: Format & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang libclang-dev pkg-config \
            liblzma-dev libbz2-dev zlib1g-dev \
            libtesseract-dev libleptonica-dev tesseract-ocr-eng

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious

  # ── Docs: build exactly the way Read the Docs does ─────────────────────────
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mirrors .readthedocs.yaml: same Python version, same requirements file.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install documentation dependencies
        run: pip install -r docs/requirements.txt

      # --strict turns broken internal links and nav warnings into failures.
      - name: Build documentation
        run: mkdocs build --strict

  install-smoke:
    name: Install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config liblzma-dev libbz2-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install CLI
        run: cargo install --path crates/cli --locked --force
      - name: Smoke commands
        run: |
          rxchef --version
          rxchef --help
          rxchef operations --json > /dev/null

  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config liblzma-dev libbz2-dev zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - run: cargo llvm-cov --workspace --summary-only
