[package]
name = "rxchef-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Persistent rxchef recipes, variables, project data, and execution history"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rxchef-store"
readme = "README.md"
keywords = ["cyberchef", "recipes", "storage"]
categories = ["command-line-utilities", "data-structures"]

[dependencies]
rxchef = { version = "0.2.0-rc.2", path = "../..", default-features = false }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
chrono      = { version = "0.4", features = ["serde"] }
dirs        = "5"
thiserror   = "1"
uuid        = { version = "1", features = ["v4"] }
schemars = { version = "1", optional = true }

[features]
schema = ["dep:schemars", "rxchef/schema"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
