[package]
name = "rxchef-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Typed local and remote execution clients for rxchef recipes and graph jobs"
documentation = "https://docs.rs/rxchef-client"
keywords = ["cyberchef", "client", "recipes", "encoding"]
categories = ["development-tools", "encoding"]

[dependencies]
schemars = { version = "1", optional = true }
rxchef-store = { version = "0.2.0-rc.2", path = "../store" }
rxchef = { version = "0.2.0-rc.2", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
regex = "1"
reqwest = { version = "0.13.3", features = ["blocking", "json"], optional = true }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"], optional = true }

[features]
schema = ["dep:schemars", "rxchef/schema", "rxchef-store/schema"]
default = []
worker = ["dep:tokio", "dep:uuid", "dep:libc", "dep:windows-sys"]
remote = ["dep:reqwest"]

[[example]]
name = "export_contracts"
required-features = ["schema"]
