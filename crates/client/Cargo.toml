[package]
name = "rxchef-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Shared local and remote client contracts for rxchef"

[dependencies]
rxchef = { version = "0.1.0", path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
regex = "1"
reqwest = { version = "0.13.3", features = ["blocking", "json"], optional = true }

[features]
default = []
remote = ["dep:reqwest"]
