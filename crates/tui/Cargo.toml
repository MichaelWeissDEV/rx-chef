[package]
name = "rxchef_tui"
version.workspace = true
edition.workspace = true
description = "Interactive terminal interface for rxchef"
license.workspace = true
repository.workspace = true

[[bin]]
name = "rxchef_tui"
path = "src/main.rs"

[dependencies]
rxchef       = { version = "0.1.0", path = "../.." }
rxchef_store = { version = "0.1.0", path = "../store" }
ratatui      = "0.28"
crossterm    = "0.27"
serde_json   = "1"
chrono       = "0.4"
