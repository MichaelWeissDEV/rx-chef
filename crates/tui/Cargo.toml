[package]
name = "rxchef_tui"
version = "0.0.1"
edition = "2021"
description = "Interactive terminal interface for rxchef"
license = "Apache-2.0"
repository = "https://github.com/MichaelWeissDEV/rx-chef"

[[bin]]
name = "rxchef_tui"
path = "src/main.rs"

[dependencies]
rxchef       = { version = "0.0.1", path = "../.." }
rxchef_store = { version = "0.0.1", path = "../store" }
ratatui      = "0.28"
crossterm    = "0.27"
serde_json   = "1"
chrono       = "0.4"
