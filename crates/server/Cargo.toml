[package]
name = "rxchef-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Headless local HTTP and JSON-RPC server for rxchef"
readme = "README.md"

[dependencies]
rxchef = { version = "0.1.0", path = "../.." }
rxchef-client = { version = "0.1.0", path = "../client" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "io-util", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1", features = ["v4"] }
subtle = "2.6"
getrandom = "0.2"
hex = "0.4"
tower-http = { version = "0.6", features = ["fs"], optional = true }

[features]
default = []
web-ui = ["dep:tower-http"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
rxchef-client = { version = "0.1.0", path = "../client", features = ["remote"] }
tempfile = "3"
base64 = "0.22"
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", features = ["sink"] }

[[bin]]
name = "rxchef-server"
path = "src/main.rs"
