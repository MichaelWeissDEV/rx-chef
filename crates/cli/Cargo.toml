[package]
name = "rxchef-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line interface for rxchef"
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rxchef-cli"
readme = "README.md"
keywords = ["cyberchef", "cli", "encoding", "cryptography", "forensics"]
categories = ["command-line-utilities", "cryptography", "encoding"]

[[bin]]
name = "rxchef"
path = "src/main.rs"

[dependencies]
clap         = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen   = "0.2"
rxchef       = { version = "0.1.0", path = "../.." }
rxchef_store = { package = "rxchef-store", version = "0.1.0", path = "../store" }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
serde_yaml   = "0.9"
base64       = "0.22"
chrono       = "0.4"
regex        = "1"
rustyline    = "13"
shlex        = "2"
hex          = "0.4"
