[package]
name = "rxchef"
version.workspace = true
edition.workspace = true
rust-version = "1.96"
autobins = false
description = "CyberChef ported to Rust - cryptographic, encoding, and data transformation operations"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["cyberchef", "encoding", "cryptography", "forensics"]
categories = ["command-line-utilities", "cryptography", "encoding"]

[workspace]
members = [
    ".",
    "crates/cli",
    "crates/tui",
    "crates/store",
    "tests",
    "crates/xtask",
]
default-members = [
    ".",
    "crates/cli",
    "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MichaelWeissDEV/rx-chef"

[lib]
name = "rxchef"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
thiserror  = "1"
hex        = "0.4"
base64     = "0.22"
sha2       = "0.10"
sha1       = { version = "0.10", features = ["oid"] }
md-5       = { version = "0.10", features = ["oid"] }
digest     = "0.11"
hmac       = "0.12"
aes        = "0.8"
aes-gcm    = "0.10"
cbc        = { version = "0.1", features = ["alloc"] }
cfb-mode   = "0.8"
ctr        = "0.9"
des        = "0.8"
blowfish   = "0.9"
rc2        = "0.8"
flate2     = "1"
bzip2      = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
regex      = "1"
chrono     = { version = "0.4", features = ["serde"] }
url        = "2"
crc        = "3"
num-bigint = "0.4"
num-traits = "0.2"
uuid       = { version = "1", features = ["v4"] }
unicode-normalization = "0.1"
encoding_rs = "0.8"
rand       = "0.8"
pbkdf2     = "0.12"
argon2     = "0.5"
scrypt     = "0.11"
rsa        = { version = "0.9", features = ["sha2"] }
cipher     = "0.4"
block-padding = "0.3"
generic-array = "0.14"
getrandom  = "0.2"
data-encoding = "2"
itertools  = "0.12"
bcrypt = "0.19.1"
ring = "0.17.14"
blake2 = "0.10.6"
blake3 = "1"
byteorder = "1.5.0"
md2 = "0.11"
md4 = "0.11"
md6 = "2.0.3"
ripemd = "0.1"
sha3 = "0.10"
whirlpool = "0.11"
allthehashes = "0.1.2"
amf = "1.0.0"
apache-avro = { version = "0.21.0", features = ["derive"] }
ciborium = "0.2.2"
chacha20 = "0.10.0"
bs58 = "0.5.1"
base85 = "2.0.0"
html-escape = "0.2.13"
rmp-serde = "1.3.1"
quoted_printable = "0.5.2"
idna = "1"
plist = "1"
bson = "2"
serde_yaml = "0.9.34"
quick-xml = "0.40.1"
sqlformat = "0.5.0"
p256 = "0.13.2"
k256 = "0.13.4"
x509-parser = "0.18.1"
lz4_flex = "0.13.1"
xz2 = "0.1.7"
zip = "8.6.0"
tar = "0.4.45"
salsa20 = "0.11.0"
totp-lite = "2.0.1"
murmur3 = "0.5.2"
similar = "3.1.0"
levenshtein = "1.0.5"
streebog = "0.11.0"
gost94 = "0.10.0"
magma = "0.8.0"
kuznyechik = "0.8.0"
sm3 = "0.5.0"
sm4 = "0.6.0"
libsm = "0.6.1"
subtle = "2.6"
swc_common = "25.0.0"
swc_ecma_ast = { version = "28.0.0", features = ["serde-impl"] }
swc_ecma_parser = { version = "44.0.0", default-features = false }
fernet = { version = "0.2.2", features = ["sha2", "hmac"] }
capstone = { version = "0.14.0", optional = true }
sequoia-openpgp = { version = "2.3.0", optional = true, default-features = false, features = ["compression", "crypto-rust", "allow-experimental-crypto", "allow-variable-time-crypto"] }
jaq-core = { version = "3.0.0", optional = true }
jaq-std = { version = "3.0.0", optional = true }
jaq-json = { version = "2.0.0", optional = true }
protobuf = "3.7.2"
protobuf-parse = "3.7.2"
tempfile = "3.23.0"
prost = "0.14.3"
yara-x = { version = "1.16.0", optional = true }
phf = "0.13.1"
phf_codegen = "0.13.1"
deku = "0.20.3"
rc6 = "0.1.0"
fuzzyhash = "0.2.2"
tlv_parser = "0.10.0"
ssh-key = "0.6.7"
der = { version = "0.8.0", features = ["alloc", "heapless"] }
cms = "0.2.3"
x509-cert = "0.2.5"
spki = "0.8.0"
pkcs1 = "0.7.5"
pkcs8 = "0.11.0"
scraper = "0.27.0"
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
image = "0.25"
imageproc = "0.25"
qrcode = { version = "0.14.1", default-features = false }
rqrr = { version = "0.10.1", default-features = false }
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
rusttype = "0.9"
font8x8 = "0.3"
kamadak-exif = "0.6.1"
lofty      = "0.24.0"
ab_glyph   = "0.2"
tesseract-rs = { version = "0.4", optional = true, default-features = false, features = ["use-system-tesseract"] }

# Fernet uses the OpenSSL crate. Native Unix builds use the system library,
# while Windows builds use the vendored source so native and GNU cross-builds
# do not depend on a separately installed Windows OpenSSL SDK.
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[features]
default = []
full = ["pgp", "jsonata", "tesseract", "yara", "disassembly"]
pgp = ["dep:sequoia-openpgp"]
jsonata = ["dep:jaq-core", "dep:jaq-std", "dep:jaq-json"]
tesseract = ["dep:tesseract-rs"]
yara = ["dep:yara-x"]
disassembly = ["dep:capstone"]
